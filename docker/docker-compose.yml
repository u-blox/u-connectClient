services:
  stm32f4-builder:
    build:
      context: .
      dockerfile: stm32f4/Dockerfile
    image: u-connect-client-stm32f4:latest
    volumes:
      - ../:/project
      - ${CCACHE_DIR:-~/.ccache}:/ccache
    working_dir: /project
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - UCX_STM32_DOCKER=1
      - WIFI_SSID=${WIFI_SSID:-ubx}
      - WIFI_PSK=${WIFI_PSK:-}
      - HOME=/tmp/renode
      - XDG_CONFIG_HOME=/tmp/renode/.config
      - CCACHE_DIR=/ccache
