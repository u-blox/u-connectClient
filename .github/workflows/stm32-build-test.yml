name: STM32F407VG Build and Test

on:
  push:
    paths:
      - 'docker/stm32f4/**'  # Rebuild image when Dockerfile changes
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: u-blox/u-connectclient/stm32f4-builder
  CCACHE_DIR: /tmp/ccache

jobs:
  build-and-test-stm32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install invoke
      run: pip install invoke

    - name: Generate config for CI
      working-directory: ./examples
      run: inv generate-config

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if Docker image needs rebuild
      id: docker-check
      env:
        BEFORE_SHA: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        # Check if image exists in registry
        if docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" > /dev/null 2>&1; then
          echo "image_exists=true" >> $GITHUB_OUTPUT
        else
          echo "image_exists=false" >> $GITHUB_OUTPUT
        fi
        # Check if Dockerfile changed (safely using env vars)
        dockerfile_changed=false
        if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null | grep -q "docker/stm32f4/"; then
            dockerfile_changed=true
          fi
        fi
        echo "dockerfile_changed=$dockerfile_changed" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      if: |
        github.event_name == 'push' &&
        (steps.docker-check.outputs.image_exists == 'false' || steps.docker-check.outputs.dockerfile_changed == 'true')
      uses: docker/build-push-action@v5
      with:
        context: ./docker
        file: ./docker/stm32f4/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Pull Docker image
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Tag image for local use
      run: docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest u-connect-client-stm32f4:latest

    - name: Build STM32F407VG firmware
      working-directory: ./examples
      env:
        SKIP_DOCKER_BUILD: '1'
      run: |
        mkdir -p /tmp/ccache
        inv stm32.http.build --docker

    - name: Check build artifacts
      run: |
        ls -lh examples/bin/
        test -f examples/bin/http_example_stm32.elf
        test -f examples/bin/http_example_stm32.bin
        test -f examples/bin/http_example_stm32.hex

    - name: Run Renode emulation test
      working-directory: ./examples
      env:
        SKIP_DOCKER_BUILD: '1'
      run: |
        set -o pipefail
        inv stm32.http.emulate --timeout 120 2>&1 | tee build_stm32/renode_output.txt
      timeout-minutes: 5

    - name: Run socket Renode emulation test
      working-directory: ./examples
      env:
        SKIP_DOCKER_BUILD: '1'
      run: |
        set -o pipefail
        inv stm32.socket.emulate --build --timeout 120 2>&1 | tee build_stm32/renode_socket_output.txt
      timeout-minutes: 5

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stm32f407vg-firmware
        path: |
          examples/bin/http_example_stm32.bin
          examples/bin/http_example_stm32.hex
          examples/bin/http_example_stm32.elf
          examples/bin/http_example_stm32.map
          examples/build_stm32/renode_output.txt
          examples/build_stm32/renode_socket_output.txt
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          examples/build_stm32/renode_output.txt
          examples/build_stm32/renode_socket_output.txt
        retention-days: 7
